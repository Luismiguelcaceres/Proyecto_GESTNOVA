<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en el panel de la empresa.">
    <title>Iniciar Sesión | Crear cuenta</title>
</head>
<body>
    <header>
        <a href="Index.html">
        <img src="src/images/logo.jpg.jpeg" width="100" height="50" alt="Logo de la empresa">
        </a>
    </header>
<main>
    <section aria-labelledby="titulo-register">
        <h1 id="titulo-register">Crear Cuenta</h1>
        <!-- form: define el formulario. action indica a dónde se envían los datos -->
        <form action="#" method="POST">
         <!-- fieldset agrupa campos; legend describe el grupo -->
            <fieldset>
                <legend>Credenciales para crear cuenta</legend>    
                    <!-- SIGN UP -->
                    <div class="form-panel signup-panel">
                        <div class="socials">
                                    <h3>con</h3>
                                    <a href="#" aria-label="Google">G</a>
                                </div>
                                <p class="hint">o regístrate con tu correo</p>
                                
                                <label for="fullName">Nombre completo</label>
                                <input class="field" type="text" id="fullName" placeholder="Nombre completo" required>
                                <br>
                                
                                <label for="email">Correo electrónico</label>
                                <input class="field" type="email" id="email" placeholder="Correo electrónico" required>
                                <br>

                                <label for="signupPassword">Contraseña</label>
                                <input class="field" type="password" id="signupPassword" placeholder="Contraseña" required>
                                <br>

                                <button class="btn" type="submit" style="margin-top:4px;">Registrar</button>
                            </form>
                        </div>
                    
                    </div>
            </fieldset>
        </form>     
    </section>
</main>
<footer>
<p>&copy; 2026 CMD | GESTNOVA. Todos los derechos reservados.</p>
</footer>    
</body>
</html>

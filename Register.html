<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea una nueva cuenta en el panel de la empresa.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/stylesRegister.css">


    <style>
        body { display: block; }
        header, footer { text-align: center; padding: 16px; }
        main { display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 24px; }
    </style>

    <title>Crear cuenta</title>

</head>

<body>

     <button id="btnTema" class="btn-tema" type="button" aria-label="Cambiar tema">
    <i id="iconoTema" class="bi bi-moon-stars"></i>
     </button>

    <header>
        <a href="Index.html">
        </a>
    </header>

    <main>
        <div class="container">

            <div class="form-panel signin-panel">
                <form action="#" method="POST">
                    <h1 id="titulo-register">Crear Cuenta</h1>

                    <fieldset style="border:0; width:100%; display:flex; flex-direction:column; align-items:center;">
                        <legend class="visually-hidden">Credenciales para crear cuenta</legend>

                        <input class="field" type="text" id="fullName" name="fullName" placeholder="Nombre completo" required>
                        <input class="field" type="email" id="email" name="email" placeholder="Correo electrónico" required>
                        <input class="field" type="password" id="signupPassword" name="signupPassword" placeholder="Contraseña" required>
                    </fieldset>

                    <button class="btn" type="submit">Registrar</button>
                </form>
            </div>

            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel">
                        <h2>¡Bienvenido de nuevo!</h2>
                        <p>¿Ya tienes una cuenta? Inicia sesión y continúa gestionando tu proyecto.</p>
                        <a class="btn-ghost" href="login.html">Iniciar Sesión</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="src/js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="src/css/login_style.css" rel="stylesheet">
</head>
<body>
  <button id="btnTema" class="btn-tema" type="button" aria-label="Cambiar tema">
    <i id="iconoTema" class="bi bi-moon-stars"></i>
  </button>

  <div class="container">
    <div class="form-panel signin-panel">
      <form>
        <h1>Iniciar Sesión</h1>
        <input class="field" type="email" placeholder="Correo electrónico" required>
        <input class="field" type="password" placeholder="Contraseña" required>
        <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>
        <button class="btn" type="submit">Iniciar Sesión</button>
      </form>
    </div>

    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel">
          <h2>¡Hola!</h2>
          <p>Crea tu cuenta y descubre todo lo que tenemos para ti.</p>
          <a class="btn-ghost" href="Register.html">Registrar</a>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/js/Login.js"></script>
  
</body>
</html>
